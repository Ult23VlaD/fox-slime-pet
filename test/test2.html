<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh;
    background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 40px 40px; }
  canvas { width: 320px; height: 320px; }
</style>
</head>
<body>
<canvas id="pet"></canvas>
<script src="pet.js"></script>
<script>
  window.__err = [];
  window.onerror = (m, s, l, c, e) => { window.__err.push(String(m) + ' @' + l + ':' + c); };
  const handle = window.DaimonPetThree.mount(document.getElementById('pet'), {});
  window.__pet = handle;
  handle.playBoot();
  const state = new URLSearchParams(location.search).get('state');
  if (state) setTimeout(() => handle.setState(state), 1200);
  if (new URLSearchParams(location.search).get('pat')) {
    setTimeout(() => handle.noteInteraction(), 1500);
  }
  document.getElementById('pet').addEventListener('click', (e) => {
    if (handle.hitTest(e.clientX, e.clientY)) handle.noteInteraction();
  });
</script>
</body>
</html>
